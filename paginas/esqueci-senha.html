<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#124559">
    <title>Recuperar senha · MonetaScope</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="shell">
      <header>
        <img class="logo" src="outputs/logo-monetascope.png" alt="MonetaScope">
      </header>
      <main>
        <section class="card" aria-labelledby="title">
          <div>
            <h1 id="title" tabindex="-1">Recuperar senha</h1>
            <p class="description">Informe um e-mail de exemplo para simular a recuperação.</p>
            <form action="aviso-recuperacao.html">
              <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" autocomplete="off" required placeholder="voce@exemplo.com">
              </div>
              <button class="primary">Simular recuperação</button>
            </form>
            <p class="footer">
              <a href="index.html">Voltar para entrar</a>
            </p>
          </div>
        </section>
        <figure>
          <img class="art" src="outputs/arte-barbatana.webp" alt="Barbatana azul-petróleo cercada por curvas que lembram ondas no mar.">
        </figure>
      </main>
    </div>
  </body>
</html>
