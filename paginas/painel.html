<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#124559">
    <title>Resumo financeiro · MonetaScope</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="shell">
      <header>
        <img class="logo" src="outputs/logo-monetascope.png" alt="MonetaScope">
      </header>
      <main>
        <section class="card" aria-labelledby="title">
          <div>
            <h1 id="title" tabindex="-1">Resumo financeiro</h1>
            <p class="description">Prévia com valores de exemplo.</p>
            <div class="summary">
              <div>Saldo <strong>R$ 2.150,00</strong>
            </div>
            <div>Receitas <strong class="income">R$ 3.000,00</strong>
          </div>
          <div>Despesas <strong class="expense">R$ 850,00</strong>
        </div>
        <div>A vencer <strong class="due">R$ 120,00</strong>
      </div>
    </div>
    <p class="footer">
      <a href="index.html">Voltar para entrar</a>
    </p>
  </div>
</section>
<figure>
  <img class="art" src="outputs/arte-barbatana.webp" alt="Barbatana azul-petróleo cercada por curvas que lembram ondas no mar.">
</figure>
</main>
</div>
</body>
</html>
